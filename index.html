<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>Ilustración interactiva</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gruppo&display=swap" rel="stylesheet">

<style>
html, body {
  margin: 0;
  padding: 0;
  min-height: 100%;
  overflow-x: hidden;
  background: black;
  font-family: 'Gruppo', sans-serif;

}
/* =========================
   WRAPPER REAL DE LA IMAGEN
   ========================= */

.imagen-wrapper {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
 }

.imagen-wrapper img {
  display: block;
  max-width: 100vw;
  max-height: 100vh;
}

/* CONTENEDOR DE LA IMAGEN */
.contenedor {
  position: relative;
  width: 100%;
  min-height: 100dvh;
}

/* HOTSPOTS (VISIBLES PARA PRUEBA) */
.hotspot {
  position: absolute;
  background: transparent;
  border: none;
  pointer-events: none; /* 🔒 bloqueados al inicio */
}

/* SÍMBOLO 1 – disco arriba izquierda */
.s1 {
  top: 13%;
  left: 13%;
  width: 26%;
  height: 27%;
}

/* SÍMBOLO 2 – onda arriba derecha */
.s2 {
  top: 14%;
  left: 47%;
  width: 37%;
  height: 23%;
}

/* SÍMBOLO 3 – zigzag con nodos */
.s3 {
  top: 38%;
  left: 56%;
  width: 17%;
  height: 25%;
}

/* SÍMBOLO 4 – rectángulo + círculo */
.s4 {
  top: 43%;
  left: 15%;
  width: 26%;
  height: 11%;
}

/* SÍMBOLO 5 – explosión radial */
.s5 {
  top: 58%;
  left: 14%;
  width: 40%;
  height: 30%;
}

/* SÍMBOLO 6 – doble círculo */
.s6 {
  top: 75%;
  left: 58%;
  width: 14%;
  height: 9%;
}

.popup {
  position: absolute;
  inset: 0;
  display: none;
  background: rgba(0,0,0,0.6);
}

.popup-contenido {
  position: absolute;
  top: 10%;
  left: 10%;
  width: 80%;
  background: rgba(255,255,255,0.95);
  padding: 1rem;
  border-radius: 12px;
  max-height: 80%;
  overflow-y: auto;
}

.cerrar {
  float: right;
  border: none;
  background: none;
  font-size: 1.2rem;
}

/* =========================
   MARCO ROJO DE RESALTADO
   ========================= */

.resaltado {
  position: absolute;
  border: 2px solid rgba(255, 60, 60, 0.9);
  border-radius: 16px;
  box-shadow: 0 0 12px rgba(255, 60, 60, 0.6);
  pointer-events: none;
  display: none;
}

.cerrar-marco {
  position: fixed;
  top: 12px;
  right: 12px;
  background: rgba(0,0,0,0.7);
  color: white;
  border: none;
  border-radius: 50%;
  width: 36px;
  height: 36px;
  font-size: 18px;
  display: none;
  z-index: 10;
}

/* CAJA DE TEXTO SOBRE LA IMAGEN */
.caja-texto {
  position: absolute;
  bottom: 6%;
  left: 50%;
  transform: translateX(-50%);
  width: 88%;

  background: rgba(20, 20, 20, 0.75);
  color: white;
  padding: 1.2rem;
  border-radius: 18px;
  font-size: 1.3rem;
  line-height: 1.7;
  letter-spacing: 0.3px;
  backdrop-filter: blur(6px);
  display: none;
  touch-action: none;

}

/* VARIANTE SUPERIOR — solo popups 5 y 6 */
.caja-texto.top {
  top: 6%;
  bottom: auto;
}

/* =========================
   MICRO DETALLES TÁCTILES
   ========================= */

* {
  -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none;
  user-select: none;
}

.caja-texto {
  animation: aparecer 0.25s ease-out;
}

@keyframes aparecer {
  from {
    opacity: 0;
    transform: translateX(-50%) translateY(8px);
  }
  to {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
    }
  }
@keyframes parpadeoSuave {
  0%   { opacity: 1; }
  50%  { opacity: 0.4; }
  100% { opacity: 1; }
}

/* =========================
   INDICADOR INICIAL
   ========================= */

.hint {
  position: absolute;
  bottom: 4%;
  left: 50%;
  transform: translateX(-50%);

  width: 90%;
  text-align: center;

  color: #d4af37;
  text-shadow: 0 0 8px rgba(212, 175, 55, 0.8);

  font-size: 2.2rem;   /* MÁS GRANDE */
  letter-spacing: 1px;

  opacity: 1;
  transition: opacity 0.3s ease;
  pointer-events: none;
  z-index: 5000;
}

.hint.oculto {
  opacity: 0;
}
.hint.activo {
  animation: parpadeoSuave 2s ease-in-out infinite;
}

/* =========================
   INTROS CENTRADAS
   ========================= */

.intro-texto {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 80%;
  max-width: 420px;

  text-align: center;
  color: white;
  font-family: 'Gruppo', sans-serif;
  font-size: 1.3rem;
  line-height: 1.7;
  letter-spacing: 0.5px;

  background: rgba(0,0,0,0.6);
  padding: 1.5rem;
  border-radius: 18px;

  z-index: 10000;

  /* CLAVE PARA NO ROMPER INTERACCIÓN */
  display: none;
  opacity: 0;
  transition: opacity 1s ease;

  pointer-events: none;
}

/* =========================
   TEXTO PUNTILLISTA
   ========================= */

.punto {
  opacity: 0;
  filter: blur(4px);
  transition: opacity 0.25s ease, filter 0.25s ease;
  white-space: normal;
}

#texto-animado {
  white-space: pre-wrap;
  word-break: break-word;
}


.punto.visible {
  opacity: 1;
  filter: blur(0);
}

/* =========================
   APARICIÓN SUAVE DEL TEXTO
   ========================= */

.texto-fade-in {
  opacity: 0;
  transform: translateY(4px);
  transition: opacity 0.8s ease, transform 0.8s ease;
}

.texto-fade-in.visible {
  opacity: 1;
  transform: translateY(0);
}

/* =========================
   BANDERAS SOBRE EL DISCO
   ========================= */

.bandera {
  position: absolute;
  height: 33px;
  width: auto;
  object-fit: contain;
  cursor: pointer;
  transition: transform 0.2s ease;
  z-index: 20000;
}

.bandera-es:hover {
  transform: translateY(-110%) scale(1.1);
}

.bandera-en:hover {
  transform: translateY(-110%) scale(1.1);
}
.bandera-es {
  top: 0;
  left: 0;
  transform: translateY(-110%);
}

.bandera-en {
  top: 0;
  right: 0;
  transform: translateY(-110%);
}

.bandera.oculta {
  display: none;
}

.bandera.bloqueada {
  pointer-events: none;
  cursor: default;
}

/* =========================
   TEXTO IDIOMA ENTRE BANDERAS
   ========================= */

.label-idioma {
  position: absolute;
  top: 0;
  left: 50%;
  transform: translate(-50%, -110%);
  font-family: 'Gruppo', sans-serif;
  font-size: 1.2rem;
  letter-spacing: 1px;
  color: white;
  display: flex;
  align-items: center;
  gap: 35px;
  z-index: 20000;
  text-align: center;
}

.flecha {
  color: #d4af37;
  font-size: 2.2rem;      /* más grandes */
  font-weight: 300;
  letter-spacing: 2px;
  transform: scaleX(1.6); /* las hace más largas horizontalmente */
  display: inline-block;
}
.flecha.derecha {
  margin-right: 12px;
}

@media (orientation: landscape) {

  html, body {
    overflow: auto;
  }

  .contenedor {
    height: auto;
    min-height: 100vh;
    overflow: visible;
  }

  .imagen-wrapper {
    position: relative;
    top: auto;
    left: auto;
    transform: none;
    margin: 40px auto;
    text-align: center;
  }

  .imagen-wrapper img {
    max-height: 85vh;
    width: auto;
  }

}

</style>
</head>

const VELOCIDAD_INTRO = 110;
const PAUSA_INTRO = 700;

function escribirIntro(texto, callback) {
  const el = document.getElementById('intro-animado');
  el.textContent = '';
  let i = 0;

  function escribir() {
    if (i < texto.length) {
      el.textContent += texto[i];
      i++;
      setTimeout(escribir, VELOCIDAD_INTRO);
    } else {
      callback();
    }
  }

  escribir();
}

function mostrarIntro() {
  const intro = document.getElementById('intro');
  intro.style.display = 'block';
  requestAnimationFrame(() => {
    intro.style.opacity = '1';
  });
}

function ocultarIntro(callback) {
  const intro = document.getElementById('intro');
  intro.style.opacity = '0';
  setTimeout(() => {
    intro.style.display = 'none';
    if (callback) callback();
  }, 1000);
}

function ejecutarIntros(indice = 0) {
  if (indice >= textosIntro[idiomaActual].length) {

fadeOutAudio(3000);  // 3 segundos de salida

    // 🔓 ACTIVAR HOTSPOTS
    document.querySelectorAll('.hotspot').forEach(h => {
      h.style.pointerEvents = 'auto';
    });

    // 👆 MOSTRAR HINT
   const hint = document.querySelector('.hint');
hint.textContent = idiomaActual === 'es' ? 'Toca un símbolo' : 'Touch a symbol';
hint?.classList.remove('oculto');
hint?.classList.add('activo');
    return;
  }

    // limpiar texto ANTES de mostrar la intro
  document.getElementById('intro-animado').textContent = '';

  mostrarIntro();

  const pausaFade = indice === 1 ? 700 : 600;


  setTimeout(() => {
    escribirIntro(textosIntro[idiomaActual][indice], () => {
      setTimeout(() => {
        ocultarIntro(() => {
          setTimeout(() => {
            ejecutarIntros(indice + 1);
          }, PAUSA_INTRO);
        });
      }, 1000);
    });
  }, pausaFade);
}

    s3: `Video image showing scan direction. The binary code indicates the time of each scan sweep (512 vertical lines per full image). When decoded correctly, the first image will be a circle.`,

const audio = document.getElementById('audioIntro');
const audioClick = document.getElementById('audioClick');

function sonidoClick() {
  if (!audioClick) return;

  audioClick.currentTime = 0;
  audioClick.volume = 0.4; // sutil
  audioClick.play().catch(() => {});
}

function fadeInAudio(duration = 2000) {

  let step = 0.05;
  let interval = duration / (1 / step);

  const fade = setInterval(() => {
    if (audio.volume < 1) {
      audio.volume = Math.min(1, audio.volume + step);
    } else {
      clearInterval(fade);
    }
  }, interval);
}

function fadeOutAudio(duration = 2000) {
  const step = 0.05;
  const interval = duration / (1 / step);

  const fade = setInterval(() => {
    if (audio.volume > 0) {
      audio.volume = Math.max(0, audio.volume - step);
    } else {
      clearInterval(fade);
      audio.pause();
    }
  }, interval);
}

/* =========================
   TEXTO PUNTILLISTA
   ========================= */

function escribirPuntillista(texto, elementoId, velocidad = 12) {
  const el = document.getElementById(elementoId);
  el.innerHTML = '';

  const spans = [];

  texto.split('').forEach(char => {
    const span = document.createElement('span');
  span.textContent = char;

    span.classList.add('punto');
    el.appendChild(span);
    spans.push(span);
  });

  const orden = spans.sort(() => Math.random() - 0.5);

  let i = 0;
  const intervalo = setInterval(() => {
    orden[i].classList.add('visible');
    i++;
    if (i >= orden.length) {
      clearInterval(intervalo);
    }
  }, velocidad);
}

function desvanecerPuntillista(elementoId, callback) {
  const el = document.getElementById(elementoId);
  const puntos = Array.from(el.querySelectorAll('.punto'));

  // orden aleatorio
  const orden = puntos.sort(() => Math.random() - 0.5);

  let i = 0;
  const intervalo = setInterval(() => {
    orden[i].classList.remove('visible');
    i++;

    if (i >= orden.length) {
      clearInterval(intervalo);
      if (callback) callback();
    }
  }, 12);
}

function prepararTextoParaDesvanecer(elementoId) {
  const el = document.getElementById(elementoId);
  const texto = el.textContent;
  el.innerHTML = '';

  texto.split('').forEach(char => {
    const span = document.createElement('span');
    span.textContent = char;
    span.classList.add('punto', 'visible');
    el.appendChild(span);
  });
}

if (hint) {

// forzar reflow para que el fade funcione siempre
void texto.offsetWidth;

texto.classList.add('visible');

  temporizadorPopup = setTimeout(() => {
    ocultarMarco();
  }, 11000);
}

function ocultarMarco() {
clearTimeout(temporizadorPopup);
popupActivo = false;



  const texto = document.getElementById('texto-animado');



// convertir el texto actual en puntitos (SIN animación)
prepararTextoParaDesvanecer('texto-animado');

setTimeout(() => {
  desvanecerPuntillista('texto-animado', () => {

     document.querySelector('.resaltado.s1').style.display = 'none';
    document.querySelector('.resaltado.s2').style.display = 'none';
    document.querySelector('.resaltado.s3').style.display = 'none';
    document.querySelector('.resaltado.s4').style.display = 'none';
    document.querySelector('.resaltado.s5').style.display = 'none';
    document.querySelector('.resaltado.s6').style.display = 'none';


    document.querySelector('.cerrar-marco').style.display = 'none';
    document.getElementById('caja-texto-1').style.display = 'none';


   const caja = document.getElementById('caja-texto-1');
   caja.classList.remove('top');

const hint = document.querySelector('.hint');
if (hint) {
  hint.textContent = idiomaActual === 'es'
    ? 'Toca un símbolo'
    : 'Touch a symbol';

  hint.classList.remove('oculto');
  hint.classList.add('activo');
}
  });
}, 50);

}





// =========================
// SWIPE DOWN PARA CERRAR
// =========================

let startY = 0;
let currentY = 0;
let dragging = false;

const cajaTexto = document.getElementById('caja-texto-1');

if (cajaTexto) {

  cajaTexto.addEventListener('touchstart', (e) => {
    startY = e.touches[0].clientY;
    dragging = true;
  }, { passive: true });

  cajaTexto.addEventListener('touchmove', (e) => {
    if (!dragging) return;

    currentY = e.touches[0].clientY;
    const deltaY = currentY - startY;

    if (deltaY > 0) {
      e.preventDefault(); // 🔑 CLAVE
      cajaTexto.style.transform = `translateY(${deltaY}px)`;
    }
  }, { passive: false });

  cajaTexto.addEventListener('touchend', () => {
    dragging = false;

    const deltaY = currentY - startY;

    if (deltaY > 80) {
      cajaTexto.style.transform = '';
      ocultarMarco();
    } else {
      cajaTexto.style.transform = '';
    }
  });

}
// Cerrar tocando fuera del panel (NO afecta al swipe ni a la X)
document.addEventListener('pointerdown', (e) => {
  const caja = document.getElementById('caja-texto-1');
  const marco = document.querySelector('.resaltado.s1');

  if (
    marco &&
    marco.style.display === 'block' &&
    !e.target.closest('.caja-texto') &&
    !e.target.closest('.hotspot') &&
    !e.target.closest('.cerrar-marco')
  ) {
    ocultarMarco();
  }
});

function iniciarExperiencia() {

  // 🔓 Desbloquear audio inmediatamente en el gesto
  audio.volume = 0;
  audio.play().then(() => {
    fadeInAudio(3000);
  }).catch(() => {
    console.log("El navegador bloqueó el audio");
  });

  ejecutarIntros();
}
